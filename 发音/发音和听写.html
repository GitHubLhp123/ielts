<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>雅思单词学习器 · 只听循环模式</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #dfe7f3;
            --bg-strong: #d7e1ef;
            --panel: rgba(255, 255, 255, 0.68);
            --panel-strong: rgba(255, 255, 255, 0.9);
            --panel-soft: rgba(255, 255, 255, 0.56);
            --line: rgba(15, 23, 42, 0.08);
            --line-strong: rgba(15, 23, 42, 0.16);
            --text: #081120;
            --muted: #556171;
            --subtle: #748197;
            --blue: #1473ff;
            --blue-soft: rgba(20, 115, 255, 0.14);
            --blue-strong: #0c57d4;
            --violet: #615fff;
            --violet-soft: rgba(97, 95, 255, 0.12);
            --green: #17b26a;
            --red: #ec5b5b;
            --gold: #f1b53d;
            --shadow: 0 24px 56px rgba(10, 24, 48, 0.12);
            --shadow-soft: 0 10px 28px rgba(15, 23, 42, 0.07);
            --radius-xl: 22px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --max-width: 1480px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 0%, rgba(20, 115, 255, 0.26), transparent 24%),
                radial-gradient(circle at 88% 8%, rgba(97, 95, 255, 0.22), transparent 20%),
                radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.85), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, #ecf2f9 40%, #dee7f2 100%);
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: auto;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(22px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            top: -110px;
            right: -90px;
            background: rgba(20, 115, 255, 0.26);
        }

        body::after {
            left: -80px;
            bottom: 10%;
            background: rgba(97, 95, 255, 0.16);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .shell {
            position: relative;
            z-index: 1;
            width: min(calc(100% - 20px), var(--max-width));
            margin: 12px auto 18px;
            display: grid;
            gap: 12px;
        }

        .glass {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(250, 252, 255, 0.64));
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow);
            backdrop-filter: blur(26px) saturate(1.1);
            -webkit-backdrop-filter: blur(26px) saturate(1.1);
        }

        .hero {
            padding: 18px 20px;
            border-radius: var(--radius-xl);
            display: grid;
            gap: 14px;
            animation: rise 520ms ease-out;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            min-height: auto;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            inset: auto;
            pointer-events: none;
            z-index: -1;
        }

        .hero::before {
            width: 420px;
            height: 420px;
            top: -180px;
            right: -80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 115, 255, 0.28), rgba(20, 115, 255, 0) 66%);
            filter: blur(10px);
        }

        .hero::after {
            left: 8%;
            right: 8%;
            bottom: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.88), transparent);
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-title-wrap {
            max-width: 680px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.64);
            color: var(--blue-strong);
            letter-spacing: 0.1em;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 6px;
            font-size: clamp(24px, 3.8vw, 42px);
            line-height: 1;
            letter-spacing: -0.05em;
            font-weight: 700;
        }

        .hero-copy {
            margin: 0;
            max-width: 58ch;
            color: var(--muted);
            line-height: 1.5;
            font-size: 13px;
        }

        .hero-search {
            display: grid;
            gap: 10px;
            padding: 12px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(245, 249, 255, 0.62));
            border: 1px solid rgba(255, 255, 255, 0.66);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), var(--shadow-soft);
        }

        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            outline: none;
            font-size: 14px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
            resize: vertical;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: rgba(20, 115, 255, 0.36);
            box-shadow: 0 0 0 3px rgba(20, 115, 255, 0.12);
        }

        .search-meta-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .hero-side {
            min-width: 240px;
            flex: 1;
            display: grid;
            gap: 8px;
        }

        .hero-badges,
        .metrics-grid,
        .compact-grid,
        .setting-grid,
        .transport-grid,
        .stat-grid,
        .queue-list,
        .chapter-grid {
            display: grid;
            gap: 8px;
        }

        .hero-badges {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .badge-card,
        .metric-card,
        .compact-card,
        .chapter-card,
        .word-card,
        .queue-card,
        .difficulty-card,
        .settings-card,
        .transport-card,
        .footer-card {
            border-radius: var(--radius-lg);
        }

        .badge-card,
        .metric-card,
        .compact-card,
        .setting-box,
        .queue-item {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 254, 0.86));
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
        }

        .badge-card,
        .metric-card,
        .compact-card,
        .setting-box,
        .queue-item {
            padding: 10px 11px;
        }

        .badge-label,
        .metric-label,
        .compact-label,
        .section-label,
        .setting-caption,
        .small-text,
        .meta-text {
            color: var(--subtle);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .badge-value,
        .metric-value,
        .compact-value {
            display: block;
            margin-top: 4px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .metrics-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .main-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(360px, 0.95fr);
            gap: 10px;
            align-items: start;
        }

        .left-column,
        .right-column {
            display: grid;
            gap: 10px;
        }

        .word-card,
        .settings-card,
        .footer-card {
            padding: 12px;
        }

        .word-card {
            display: grid;
            gap: 12px;
            min-height: 420px;
            animation: rise 620ms ease-out;
            position: relative;
            overflow: hidden;
        }

        .word-card::before {
            content: "";
            position: absolute;
            top: -120px;
            right: -90px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20, 115, 255, 0.18), rgba(20, 115, 255, 0) 68%);
            pointer-events: none;
        }

        .word-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill-row,
        .detail-row,
        .toggle-row,
        .chapter-actions,
        .queue-toolbar,
        .footer-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--line-strong);
            margin: 0 4px;
        }

        .pill,
        .mode-pill,
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
        }

        .pill.active,
        .mode-pill.active,
        .chip.active {
            background: var(--blue-soft);
            border-color: rgba(22, 119, 255, 0.18);
            color: var(--blue-strong);
        }

        .word-heading {
            display: grid;
            gap: 6px;
        }

        .word-title {
            margin: 0;
            font-size: clamp(28px, 5.2vw, 56px);
            line-height: 0.95;
            letter-spacing: -0.06em;
            font-weight: 700;
        }

        .phonetic {
            font-size: 14px;
            color: var(--blue-strong);
            font-weight: 600;
        }

        .meaning-box {
            padding: 12px 14px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(240, 246, 255, 0.82));
            border: 1px solid var(--line);
            min-height: 88px;
            display: grid;
            gap: 6px;
            align-content: start;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
        }

        .meaning-text {
            margin: 0;
            font-size: clamp(16px, 2vw, 22px);
            line-height: 1.35;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .settings-card {
            display: grid;
            gap: 16px;
        }

        .setting-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .workspace-settings {
            display: grid;
            gap: 16px;
            padding: 14px;
        }

        .setting-box {
            display: grid;
            gap: 10px;
        }

        .setting-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .setting-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--blue);
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            outline: none;
        }

        .status-line {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
            min-height: 18px;
        }

        .status-line.error {
            color: #b42318;
        }

        .control-btn,
        .mini-btn,
        .segment-btn,
        .danger-btn,
        .ghost-btn,
        .play-btn,
        .toggle-btn {
            border-radius: 18px;
            transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, color 160ms ease, opacity 160ms ease;
        }

        .control-btn:hover,
        .segment-btn:hover,
        .danger-btn:hover,
        .ghost-btn:hover,
        .play-btn:hover,
        .toggle-btn:hover {
            transform: translateY(-1px);
        }

        .control-btn:active,
        .segment-btn:active,
        .danger-btn:active,
        .ghost-btn:active,
        .play-btn:active,
        .toggle-btn:active {
            transform: translateY(0) scale(0.985);
        }

        .control-btn:focus-visible,
        .segment-btn:focus-visible,
        .danger-btn:focus-visible,
        .ghost-btn:focus-visible,
        .play-btn:focus-visible,
        .toggle-btn:focus-visible,
        .search-input:focus-visible,
        select:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(20, 115, 255, 0.14), var(--shadow-soft);
        }

        .control-btn {
            padding: 16px 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(243, 247, 252, 0.92));
            border: 1px solid rgba(15, 23, 42, 0.08);
            color: var(--text);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), var(--shadow-soft);
        }

        .control-btn.primary,
        .segment-btn.primary {
            background: linear-gradient(180deg, #2e90ff 0%, #1677ff 100%);
            color: #fff;
            border: 1px solid rgba(22, 119, 255, 0.48);
            box-shadow: 0 18px 36px rgba(22, 119, 255, 0.28);
        }

        .segment-btn,
        .ghost-btn,
        .toggle-btn,
        .play-btn,
        .danger-btn {
            padding: 11px 14px;
            font-size: 14px;
            font-weight: 600;
        }

        .segment-btn {
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            border: 1px solid var(--line);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.68);
        }

        .danger-btn {
            background: rgba(236, 91, 91, 0.08);
            color: #b42318;
            border: 1px solid rgba(236, 91, 91, 0.18);
        }

        .play-btn {
            background: rgba(22, 119, 255, 0.08);
            color: var(--blue-strong);
            border: 1px solid rgba(22, 119, 255, 0.16);
        }

        .toggle-btn.active {
            background: linear-gradient(180deg, #ffd66e, #f1b53d);
            color: #5a3b00;
            border: 1px solid rgba(241, 181, 61, 0.5);
        }

        .queue-card {
            padding: 14px;
        }

        .queue-list {
            margin-top: 12px;
            display: grid;
            gap: 8px;
        }

        .queue-item {
            display: grid;
            gap: 10px;
        }

        .queue-item.active {
            background: linear-gradient(180deg, rgba(22, 119, 255, 0.14), rgba(22, 119, 255, 0.08));
            border-color: rgba(22, 119, 255, 0.16);
        }

        .queue-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .queue-word {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .queue-item {
            cursor: pointer;
            padding: 10px 11px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 254, 0.86));
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
            transition: all 160ms ease;
        }

        .queue-item:hover {
            border-color: rgba(20, 115, 255, 0.18);
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.08);
        }

        .empty {
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.62);
            border: 1px dashed rgba(15, 23, 42, 0.14);
            color: var(--muted);
            line-height: 1.7;
        }

        .footer-card {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-copy {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
            max-width: 72ch;
            font-size: 14px;
        }

        .action-panel {
            padding: 10px 12px;
        }

        .action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .mono {
            font-variant-numeric: tabular-nums;
        }

        .hidden-visual {
            display: none !important;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.995);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 1220px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .setting-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .hero-badges {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .shell {
                width: min(calc(100% - 18px), var(--max-width));
                margin: 10px auto 20px;
            }
            .hero,
            .word-card,
            .settings-card,
            .workspace-settings,
            .footer-card,
            .queue-card {
                border-radius: 24px;
            }
            .hero,
            .word-card,
            .settings-card,
            .workspace-settings,
            .footer-card {
                padding: 18px;
            }
            .control-btn {
                padding: 14px 16px;
            }
            .segment-btn,
            .ghost-btn,
            .toggle-btn,
            .play-btn,
            .danger-btn {
                padding: 10px 12px;
                font-size: 13px;
            }
            .setting-grid,
            .hero-badges {
                grid-template-columns: 1fr;
            }
            .word-title {
                font-size: clamp(36px, 12vw, 64px);
            }
            .footer-toolbar {
                align-items: stretch;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero glass">
            <div class="hero-top">
                <div class="hero-title-wrap">
                    <span class="eyebrow">🎧 只听模式 · 循环强化</span>
                    <h1>雅思单词学习器</h1>
                    <p class="hero-copy">每个单词可设置播放次数(1-5)，顺序播放后自动切换下一个</p>
                </div>
                <div class="hero-side">
                    <div class="badge-card">
                        <div class="badge-label">单词总数</div>
                        <div class="badge-value" id="totalWordsBadge">0</div>
                    </div>
                    <div class="badge-card">
                        <div class="badge-label">当前进度</div>
                        <div class="badge-value" id="progressBadge">0 / 0</div>
                    </div>
                </div>
            </div>

            <div class="hero-search">
                <div>
                    <div class="section-label">单词导入</div>
                    <h2 class="chapter-title" style="margin:8px 0 0;">粘贴单词表开始学习</h2>
                </div>
                <textarea id="wordRawInput" class="search-input" rows="3" placeholder="e.g.&#10;analyze, consequence, environment&#10;significant&#10;therefore, beneficial"></textarea>
                <div class="search-bar">
                    <button id="loadWordsBtn" class="control-btn primary" style="flex:1; min-width:140px;">📖 加载并重置进度</button>
                    <button id="clearCacheBtn" class="segment-btn danger-btn" style="flex:1; min-width:140px;">🗑 清除缓存</button>
                </div>
                <div class="search-meta-row">
                    <span class="pill active" id="loadStatus">请加载单词表开始学习</span>
                </div>
            </div>
        </section>

        <section class="main-layout">
            <div class="left-column">
                <section class="word-card glass">
                    <div class="word-top">
                        <div>
                            <div class="section-label">当前单词</div>
                            <div class="pill-row" style="margin-top:10px;">
                                <span class="mode-pill active" id="currentModeBadge">🎧 只听模式</span>
                                <span class="pill" id="currentWordIndex">0 / 0</span>
                            </div>
                        </div>
                    </div>

                    <div class="word-heading">
                        <h2 class="word-title" id="currentWordText">Ready</h2>
                        <div class="phonetic" id="currentPhonetic">/ -- /</div>
                    </div>

                    <div class="meaning-box" id="currentMeaningBox">
                        <div class="section-label">释义</div>
                        <p class="meaning-text" id="currentMeaningText">加载单词后，这里会显示当前单词释义。</p>
                    </div>
                </section>

                <section class="settings-card workspace-settings glass">
                    <div>
                        <div class="section-label">播放设置</div>
                        <h2 class="chapter-title" style="margin:8px 0 0;">发音人、语速、间隔与循环次数</h2>
                    </div>
                    <div class="setting-grid">
                        <div class="setting-box">
                            <div class="setting-head">
                                <span class="setting-caption">发音人</span>
                            </div>
                            <select id="voiceSelect"></select>
                        </div>
                        <div class="setting-box">
                            <div class="setting-head">
                                <span class="setting-caption">语速</span>
                                <strong class="setting-value mono" id="rateValue">1.0</strong>
                            </div>
                            <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.05" value="1.0">
                        </div>
                        <div class="setting-box">
                            <div class="setting-head">
                                <span class="setting-caption">间隔</span>
                                <strong class="setting-value mono" id="intervalValue">1.5s</strong>
                            </div>
                            <input type="range" id="intervalInput" min="0.5" max="5" step="0.5" value="1.5">
                        </div>
                        <div class="setting-box">
                            <div class="setting-head">
                                <span class="setting-caption">循环次数</span>
                                <strong class="setting-value mono" id="repeatValue">1</strong>
                            </div>
                            <input type="range" id="repeatSlider" min="1" max="5" step="1" value="1">
                        </div>
                    </div>
                    <div class="footer-toolbar">
                        <button class="segment-btn play-btn" id="replayCurrentBtn">🔊 发音</button>
                        <button class="segment-btn" id="prevWordBtn">◀ 上一个</button>
                        <button class="segment-btn primary" id="togglePlayPauseBtn">▶ 开始</button>
                        <button class="segment-btn" id="nextWordBtn">下一个 ▶</button>
                    </div>
                    <span class="status-line" id="globalStatus" aria-live="polite">准备就绪。</span>
                </section>
            </div>

            <div class="right-column">
                <section class="queue-card glass">
                    <div class="queue-toolbar">
                        <div>
                            <div class="section-label">单词列表</div>
                            <div class="small-text">点击单词可跳转</div>
                        </div>
                        <span class="pill" id="remainingCount">(0)</span>
                    </div>
                    <div id="wordListContainer" class="queue-list">
                        <div class="empty">✨ 加载单词表后显示</div>
                    </div>
                </section>
            </div>
        </section>

        <footer class="footer-card glass">
            <div class="footer-copy">
                支持英音优先 · 苹果设计 · 自动缓存进度 · 可设置每个单词重复播放次数
            </div>
        </footer>
    </div>

    <script>
        (function() {
            // ========== 全局数据 ==========
            let wordItems = [];                // { text }  不再需要removed标记
            let practiceActive = false;
            let currentTimeout = null;
            let currentUtterance = null;
            let isSpeaking = false;
            let currentWordObj = null;
            let activeIndex = -1;              // 当前在完整单词列表中的索引

            // 语音设置
            let availableVoices = [];
            let selectedVoiceURI = "";
            let speechRate = 1.0;
            let repeatCount = 1;               // 每个单词播放次数 (1-5)

            // DOM 元素
            const wordRawInput = document.getElementById('wordRawInput');
            const loadWordsBtn = document.getElementById('loadWordsBtn');
            const clearCacheBtn = document.getElementById('clearCacheBtn');
            const replayCurrentBtn = document.getElementById('replayCurrentBtn');
            const prevWordBtn = document.getElementById('prevWordBtn');
            const togglePlayPauseBtn = document.getElementById('togglePlayPauseBtn');
            const nextWordBtn = document.getElementById('nextWordBtn');
            const intervalInput = document.getElementById('intervalInput');
            const voiceSelect = document.getElementById('voiceSelect');
            const rateSlider = document.getElementById('rateSlider');
            const rateValue = document.getElementById('rateValue');
            const intervalValue = document.getElementById('intervalValue');
            const repeatSlider = document.getElementById('repeatSlider');
            const repeatValue = document.getElementById('repeatValue');
            const currentModeBadge = document.getElementById('currentModeBadge');
            const currentWordIndex = document.getElementById('currentWordIndex');
            const currentWordText = document.getElementById('currentWordText');
            const currentPhonetic = document.getElementById('currentPhonetic');
            const currentMeaningText = document.getElementById('currentMeaningText');
            const wordListContainer = document.getElementById('wordListContainer');
            const remainingCountSpan = document.getElementById('remainingCount');
            const globalStatus = document.getElementById('globalStatus');
            const loadStatus = document.getElementById('loadStatus');
            const totalWordsBadge = document.getElementById('totalWordsBadge');
            const progressBadge = document.getElementById('progressBadge');

            // ---------- 辅助函数 ----------
            function setStatus(msg, isError = false) {
                globalStatus.textContent = msg;
                globalStatus.classList.toggle('error', isError);
                loadStatus.textContent = msg;
                loadStatus.classList.toggle('error', isError);
                setTimeout(() => {
                    if (globalStatus.textContent === msg && !isError) {
                        globalStatus.classList.remove('error');
                        loadStatus.classList.remove('error');
                    }
                }, 2500);
            }

            function cancelSpeechAndTimer() {
                if (currentTimeout) { clearTimeout(currentTimeout); currentTimeout = null; }
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                if (currentUtterance) { currentUtterance.onend = null; currentUtterance.onerror = null; currentUtterance = null; }
                isSpeaking = false;
            }

            function getActiveList() {
                // 只听模式不再移除单词，所以始终返回全部
                return [...wordItems];
            }

            function getActiveWordByIndex(index) {
                const active = getActiveList();
                if (index >= 0 && index < active.length) return active[index];
                return null;
            }

            // 加载可用语音并填充下拉框
            function loadVoices() {
                return new Promise((resolve) => {
                    const update = () => {
                        let voices = window.speechSynthesis.getVoices();
                        if (voices && voices.length) {
                            availableVoices = voices;
                            const currentVal = voiceSelect.value;
                            voiceSelect.innerHTML = '';
                            let preferredURI = null;
                            voices.forEach(voice => {
                                const option = document.createElement('option');
                                option.value = voice.voiceURI;
                                let label = `${voice.name} (${voice.lang})`;
                                if (voice.lang === 'en-GB') label = '🇬🇧 ' + label;
                                else if (voice.lang.startsWith('en')) label = '🇺🇸 ' + label;
                                option.textContent = label;
                                voiceSelect.appendChild(option);
                                if (voice.name === 'Google UK English Male' && voice.lang === 'en-GB') preferredURI = voice.voiceURI;
                                else if (voice.lang === 'en-GB' && !preferredURI) preferredURI = voice.voiceURI;
                            });
                            if (preferredURI) voiceSelect.value = preferredURI;
                            else if (voices.length) voiceSelect.value = voices[0].voiceURI;
                            if (currentVal && Array.from(voiceSelect.options).some(o => o.value === currentVal)) voiceSelect.value = currentVal;
                            selectedVoiceURI = voiceSelect.value;
                            resolve(voices);
                        } else {
                            setTimeout(update, 150);
                        }
                    };
                    if (window.speechSynthesis.getVoices().length) update();
                    else window.speechSynthesis.addEventListener('voiceschanged', update, { once: true });
                });
            }

            function getSelectedVoice() {
                return availableVoices.find(v => v.voiceURI === selectedVoiceURI) || null;
            }

            // 核心发音方法 (单次朗读)
            function speakWord(word, onEndCallback) {
                cancelSpeechAndTimer();
                const utterance = new SpeechSynthesisUtterance(word);
                const voice = getSelectedVoice();
                if (voice) utterance.voice = voice;
                utterance.rate = parseFloat(rateSlider.value);
                utterance.pitch = 1.0;
                utterance.onstart = () => {
                    isSpeaking = true;
                    setStatus(`🔊 朗读: ${word}`);
                };
                utterance.onend = () => {
                    isSpeaking = false;
                    setStatus('✅ 发音完成');
                    if (onEndCallback) onEndCallback();
                };
                utterance.onerror = () => {
                    isSpeaking = false;
                    setStatus('⚠️ 发音失败', true);
                    if (onEndCallback) onEndCallback();
                };
                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            }

            // 循环朗读当前单词 repeatCount 次，全部完成后调用 onComplete
            function speakWordWithRepeat(word, times, onComplete) {
                if (times <= 0) {
                    if (onComplete) onComplete();
                    return;
                }
                speakWord(word, () => {
                    // 递归朗读下一次，中间可以加一个微小延迟避免合成冲突
                    if (times > 1) {
                        setTimeout(() => {
                            speakWordWithRepeat(word, times - 1, onComplete);
                        }, 120); // 120ms 缓冲
                    } else {
                        if (onComplete) onComplete();
                    }
                });
            }

            // 渲染单词列表 + 高亮
            function renderWordList() {
                const active = getActiveList();
                const total = active.length;
                totalWordsBadge.textContent = total;
                const currentDisplayIndex = activeIndex >= 0 ? activeIndex + 1 : 0;
                progressBadge.textContent = `${currentDisplayIndex} / ${total}`;
                remainingCountSpan.textContent = `(${total})`;

                if (!active.length) {
                    wordListContainer.innerHTML = `<div class="empty">📭 单词列表为空，请加载单词</div>`;
                    return;
                }
                let html = '';
                active.forEach((w, index) => {
                    const isCurr = (activeIndex === index);
                    html += `<div class="queue-item ${isCurr ? 'active' : ''}" data-word="${escapeHtml(w.text)}" data-index="${index}">
                        <div class="queue-top">
                            <div class="queue-word">${escapeHtml(w.text)}</div>
                            <div class="small-text">${index + 1}</div>
                        </div>
                    </div>`;
                });
                wordListContainer.innerHTML = html;
                document.querySelectorAll('.queue-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = parseInt(el.getAttribute('data-index'));
                        const target = getActiveWordByIndex(idx);
                        if (target) jumpToWord(target, idx);
                    });
                });
            }

            function jumpToWord(wordObj, index) {
                if (!wordObj) return;
                cancelSpeechAndTimer();
                activeIndex = index;
                currentWordObj = wordObj;
                renderWordList();
                updateCurrentWordDisplay();
                const wasActive = practiceActive;
                if (wasActive) practiceActive = false;
                updatePlayPauseButton();
                // 单独播放该单词，使用循环次数
                speakWordWithRepeat(wordObj.text, repeatCount, () => {
                    if (wasActive) {
                        practiceActive = true;
                        updatePlayPauseButton();
                        scheduleNextListen();
                    }
                });
            }

            function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

            function updateCurrentWordDisplay() {
                if (!currentWordObj) {
                    currentWordText.textContent = 'Ready';
                    currentPhonetic.textContent = '/ -- /';
                    currentMeaningText.textContent = '加载单词后，这里会显示当前单词释义。';
                    currentWordIndex.textContent = '0 / 0';
                    return;
                }
                const total = wordItems.length;
                const displayIndex = activeIndex >= 0 ? activeIndex + 1 : 0;
                currentWordText.textContent = currentWordObj.text;
                currentPhonetic.textContent = '/ -- /';
                currentMeaningText.textContent = '释义功能待实现';
                currentWordIndex.textContent = `${displayIndex} / ${total}`;
                progressBadge.textContent = `${displayIndex} / ${total}`;
            }

            // 调度下一个单词 (单词间间隔)
            function scheduleNextListen() {
                if (!practiceActive) return;
                const active = getActiveList();
                if (active.length === 0) {
                    finishPractice("🏁 所有单词播放完毕！");
                    return;
                }
                activeIndex++;
                if (activeIndex >= active.length) {
                    finishPractice("🏁 所有单词播放完毕！");
                    return;
                }
                const nextWord = active[activeIndex];
                currentWordObj = nextWord;
                updateCurrentWordDisplay();
                renderWordList();
                const interval = parseFloat(intervalInput.value) * 1000;
                currentTimeout = setTimeout(() => {
                    currentTimeout = null;
                    if (practiceActive) {
                        speakWordWithRepeat(nextWord.text, repeatCount, () => {
                            if (practiceActive) scheduleNextListen();
                        });
                    }
                }, interval);
            }

            // 开始练习
            function startPractice() {
                const active = getActiveList();
                if (!active.length) {
                    setStatus("没有单词，请加载单词表", true);
                    return;
                }
                if (practiceActive) {
                    cancelSpeechAndTimer();
                    practiceActive = false;
                }
                practiceActive = true;
                cancelSpeechAndTimer();

                if (activeIndex < 0 || activeIndex >= active.length) {
                    activeIndex = 0;
                }
                const word = active[activeIndex];
                currentWordObj = word;
                updateCurrentWordDisplay();
                renderWordList();
                updatePlayPauseButton();
                speakWordWithRepeat(word.text, repeatCount, () => {
                    if (practiceActive) scheduleNextListen();
                });
                setStatus("🎧 开始只听模式", false);
            }

            function pausePractice() {
                if (!practiceActive) {
                    setStatus("没有进行中的练习", false);
                    return;
                }
                practiceActive = false;
                cancelSpeechAndTimer();
                setStatus("⏸️ 已暂停", false);
                updatePlayPauseButton();
            }

            function stopPractice() {
                if (practiceActive) practiceActive = false;
                cancelSpeechAndTimer();
                setStatus("⏹️ 练习结束", false);
                currentWordObj = null;
                activeIndex = -1;
                updateCurrentWordDisplay();
                renderWordList();
                updatePlayPauseButton();
            }

            function finishPractice(msg) {
                if (practiceActive) practiceActive = false;
                cancelSpeechAndTimer();
                setStatus(msg, false);
                currentWordObj = null;
                activeIndex = -1;
                updateCurrentWordDisplay();
                renderWordList();
                updatePlayPauseButton();
            }

            function updatePlayPauseButton() {
                if (practiceActive) {
                    togglePlayPauseBtn.textContent = '⏸️ 暂停';
                    togglePlayPauseBtn.classList.add('active');
                    togglePlayPauseBtn.classList.remove('primary');
                } else {
                    togglePlayPauseBtn.textContent = '▶ 开始';
                    togglePlayPauseBtn.classList.remove('active');
                    togglePlayPauseBtn.classList.add('primary');
                }
            }

            function togglePlayPause() {
                if (!practiceActive) {
                    const active = getActiveList();
                    if (!active.length) {
                        setStatus("没有单词，请加载单词表", true);
                        return;
                    }
                    startPractice();
                } else {
                    pausePractice();
                }
            }

            function replayCurrent() {
                if (!currentWordObj) {
                    setStatus("无当前单词可重播", true);
                    return;
                }
                cancelSpeechAndTimer();
                const wasActive = practiceActive;
                if (wasActive) practiceActive = false;
                updatePlayPauseButton();
                speakWordWithRepeat(currentWordObj.text, repeatCount, () => {
                    if (wasActive) {
                        practiceActive = true;
                        updatePlayPauseButton();
                        scheduleNextListen();
                    }
                });
            }

            function goToPreviousWord() {
                const active = getActiveList();
                if (active.length === 0) {
                    setStatus("单词列表为空", true);
                    return;
                }
                if (activeIndex <= 0) {
                    setStatus("已经是第一个单词", false);
                    return;
                }
                activeIndex--;
                const word = active[activeIndex];
                jumpToWord(word, activeIndex);
            }

            function goToNextWord() {
                const active = getActiveList();
                if (active.length === 0) {
                    setStatus("单词列表为空", true);
                    return;
                }
                if (activeIndex >= active.length - 1) {
                    setStatus("已经是最后一个单词", false);
                    return;
                }
                activeIndex++;
                const word = active[activeIndex];
                jumpToWord(word, activeIndex);
            }

            // 加载单词表并完整重置
            function loadAndReset() {
                const raw = wordRawInput.value;
                let parsed = [];
                const lines = raw.split(/\r?\n/);
                for (let line of lines) {
                    if (line.includes(',') || line.includes('，')) {
                        let parts = line.split(/[,，]+/);
                        for (let p of parts) { let trim = p.trim(); if (trim) parsed.push(trim); }
                    } else { let trim = line.trim(); if (trim) parsed.push(trim); }
                }
                if (parsed.length === 0) {
                    setStatus("未检测到有效单词", true);
                    return;
                }
                const unique = [];
                const seen = new Set();
                for (let w of parsed) {
                    let low = w.toLowerCase();
                    if (!seen.has(low)) { seen.add(low); unique.push(w); }
                }
                if (practiceActive) { cancelSpeechAndTimer(); practiceActive = false; }
                wordItems = unique.map(txt => ({ text: txt }));
                currentWordObj = null;
                activeIndex = -1;
                persistData();
                updateCurrentWordDisplay();
                renderWordList();
                updatePlayPauseButton();
                setStatus(`✅ 加载 ${wordItems.length} 个单词`, false);
            }

            function fullClearCache() {
                localStorage.removeItem('ielts_listen_repeat');
                wordItems = [];
                practiceActive = false;
                cancelSpeechAndTimer();
                currentWordObj = null;
                activeIndex = -1;
                updateCurrentWordDisplay();
                renderWordList();
                updatePlayPauseButton();
                setStatus("🗑 缓存已清除", false);
            }

            function persistData() {
                const store = {
                    wordItems: wordItems,
                    selectedVoiceURI: selectedVoiceURI,
                    speechRate: rateSlider.value,
                    repeatCount: repeatSlider.value
                };
                localStorage.setItem('ielts_listen_repeat', JSON.stringify(store));
            }

            function loadCache() {
                const raw = localStorage.getItem('ielts_listen_repeat');
                if (!raw) return false;
                try {
                    const data = JSON.parse(raw);
                    wordItems = data.wordItems || [];
                    if (data.selectedVoiceURI) selectedVoiceURI = data.selectedVoiceURI;
                    if (data.speechRate) {
                        rateSlider.value = data.speechRate;
                        rateValue.textContent = data.speechRate;
                        speechRate = parseFloat(data.speechRate);
                    }
                    if (data.repeatCount) {
                        repeatSlider.value = data.repeatCount;
                        repeatValue.textContent = data.repeatCount;
                        repeatCount = parseInt(data.repeatCount);
                    }
                    currentWordObj = null;
                    activeIndex = -1;
                    return true;
                } catch (e) { return false; }
            }

            // 初始化
            (async () => {
                await loadVoices();
                const cached = loadCache();
                updatePlayPauseButton();
                if (!cached || wordItems.length === 0) {
                    renderWordList();
                    updateCurrentWordDisplay();
                } else {
                    renderWordList();
                    updateCurrentWordDisplay();
                    setStatus("💾 恢复缓存进度", false);
                }

                // 设置初始显示
                rateValue.textContent = rateSlider.value;
                intervalValue.textContent = intervalInput.value + 's';
                repeatValue.textContent = repeatSlider.value;

                // 事件监听器
                loadWordsBtn.addEventListener('click', loadAndReset);
                clearCacheBtn.addEventListener('click', fullClearCache);
                replayCurrentBtn.addEventListener('click', replayCurrent);
                prevWordBtn.addEventListener('click', goToPreviousWord);
                togglePlayPauseBtn.addEventListener('click', togglePlayPause);
                nextWordBtn.addEventListener('click', goToNextWord);

                rateSlider.addEventListener('input', () => {
                    rateValue.textContent = rateSlider.value;
                    speechRate = parseFloat(rateSlider.value);
                    persistData();
                });
                intervalInput.addEventListener('input', () => {
                    intervalValue.textContent = intervalInput.value + 's';
                });
                repeatSlider.addEventListener('input', () => {
                    repeatValue.textContent = repeatSlider.value;
                    repeatCount = parseInt(repeatSlider.value);
                    persistData();
                });
                voiceSelect.addEventListener('change', () => {
                    selectedVoiceURI = voiceSelect.value;
                    persistData();
                });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                    switch (e.key.toLowerCase()) {
                        case ' ':
                            e.preventDefault();
                            togglePlayPause();
                            break;
                        case 'arrowleft':
                            e.preventDefault();
                            goToPreviousWord();
                            break;
                        case 'arrowright':
                            e.preventDefault();
                            goToNextWord();
                            break;
                        case 'r':
                            e.preventDefault();
                            replayCurrent();
                            break;
                    }
                });
            })();
        })();
    </script>
</body>
</html>
